name: Build merged rule-sets

on:
  push:
    branches: [main]
    paths:
      - "sources/*.yaml"
      - "scripts/build.py"
  schedule:
    # Every day at 04:00 UTC — pick up upstream .srs updates
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: scripts
        run: python -m pytest test_build.py -v

      - name: Run build
        id: build
        run: |
          python scripts/build.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "partial_failure=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Some sources failed to download — check the build log and dist/manifest.json"
          elif [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet dist/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in dist/ — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated dist/
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: rebuild merged rule-sets [skip ci]

          $(cat dist/manifest.json | python3 -c "
          import sys, json
          m = json.load(sys.stdin)
          print(f\"Built at {m['timestamp']} with sing-box {m['sing_box_version']}\")
          for cat, info in m['categories'].items():
              inc = len(info['included_sources'])
              fail = len(info['failed_sources'])
              print(f\"  {cat}: {info['rule_count']} rules from {inc} sources ({fail} failed)\")
          ")"
          git push

      - name: Job summary
        if: always()
        run: |
          if [ -f dist/README.md ]; then
            cat dist/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.build.outputs.partial_failure }}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Some sources failed.** Check the workflow log for details." >> "$GITHUB_STEP_SUMMARY"
          fi
